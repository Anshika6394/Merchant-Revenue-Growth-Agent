[project]
name = "revpilot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["alembic>=1.14", "fastapi>=0.115", "psycopg[binary]>=3.2", "pydantic-settings>=2.6", "pwdlib[argon2]>=0.3.0", "PyJWT>=2.10", "sqlalchemy>=2.0", "uvicorn[standard]>=0.32", "python-multipart>=0.0.18", "email-validator>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
